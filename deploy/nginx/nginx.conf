user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 上游服务
    upstream pindou_api {
        server pindou-api:8080;
    }
    upstream pindou_admin_api {
        server pindou-admin-api:8080;
    }
    upstream pindou_admin_web {
        server pindou-admin-web:80;
    }

    # 移动端 API
    server {
        listen 80;
        server_name api.pindou.com;

        location / {
            proxy_pass http://pindou_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # 后台 API
    server {
        listen 80;
        server_name admin-api.pindou.com;

        location / {
            proxy_pass http://pindou_admin_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 后台前端
    server {
        listen 80;
        server_name admin.pindou.com;

        location / {
            proxy_pass http://pindou_admin_web;
            proxy_set_header Host $host;
        }
    }

    # 默认
    server {
        listen 80 default_server;
        server_name _;
        return 403;
    }
}
