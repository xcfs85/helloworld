<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拼豆 · 后台管理系统 v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶部 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FF8A5A"/>
              <stop offset="100%" stop-color="#F5C45E"/>
            </linearGradient>
          </defs>
          <circle cx="8" cy="8" r="3" fill="url(#lg)"/>
          <circle cx="16" cy="8" r="3" fill="#2A1F1A"/>
          <circle cx="24" cy="8" r="3" fill="url(#lg)"/>
          <circle cx="8" cy="16" r="3" fill="#2A1F1A"/>
          <circle cx="16" cy="16" r="3" fill="url(#lg)"/>
          <circle cx="24" cy="16" r="3" fill="#2A1F1A"/>
          <circle cx="8" cy="24" r="3" fill="url(#lg)"/>
          <circle cx="16" cy="24" r="3" fill="#2A1F1A"/>
          <circle cx="24" cy="24" r="3" fill="url(#lg)"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">拼豆 <span class="brand-en">PINDOU ADMIN</span></div>
        <div class="brand-sub">后台管理系统 · 运营控制台原型</div>
      </div>
    </div>
    <div class="topbar-search">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="2" d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm5 12l4 4"/></svg>
      <input type="text" placeholder="搜索页面 / 路由 / 菜单…" id="navSearch" />
      <span class="kbd">⌘ K</span>
    </div>
    <div class="topbar-actions">
      <span class="pill">v0.1</span>
      <span class="pill soft">1280 × 800</span>
      <span class="pill soft">Vue 3 · Element Plus</span>
      <div class="user-chip">
        <div class="avatar">运</div>
        <div class="user-meta">
          <div class="un">林运营</div>
          <div class="ur">运营组 · 在线</div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主体 -->
  <main class="layout">
    <!-- 左侧：菜单 -->
    <aside class="nav" id="nav">
      <div class="nav-list" id="navList"></div>
      <div class="nav-foot">
        <div>设计系统：温暖色系 · 8dp 网格</div>
        <div>主色 <span class="dot" style="background:#FF7A5A"></span> #FF7A5A</div>
      </div>
    </aside>

    <!-- 中间：工作区 -->
    <section class="stage">
      <div class="stage-bar">
        <button class="ghost-btn" id="prevScreen" title="上一个">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="stage-title">
          <div class="stage-name" id="stageName">—</div>
          <div class="stage-route" id="stageRoute">—</div>
        </div>
        <button class="ghost-btn" id="nextScreen" title="下一个">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="browser">
        <div class="browser-bar">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="url" id="browserUrl">admin.pindou.work/dashboard</div>
          <div class="bm-actions">
            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 12h16M4 6h16M4 18h10"/></svg>
          </div>
        </div>
        <div class="viewport" id="screen"></div>
      </div>

      <div class="stage-foot">
        <span id="stageIndex">1 / 25</span>
        <span class="muted">使用 ← → 切换页面 · 点击左侧菜单跳转</span>
      </div>
    </section>

    <!-- 右侧：说明面板 -->
    <aside class="notes">
      <div class="notes-card">
        <div class="notes-eyebrow">页面说明</div>
        <h3 id="notesTitle">—</h3>
        <p id="notesDesc" class="muted">—</p>
      </div>
      <div class="notes-card">
        <div class="notes-eyebrow">核心元素</div>
        <ul id="notesElements" class="bullets"></ul>
      </div>
      <div class="notes-card">
        <div class="notes-eyebrow">设计要点</div>
        <ul id="notesDesign" class="bullets"></ul>
      </div>
      <div class="notes-card subtle">
        <div class="notes-eyebrow">需求依据</div>
        <p class="muted small">本原型基于 <b>后台管理系统需求规格说明书 v0.1</b>，覆盖登录权限、用户、内容审核、模板、运营、数据统计、系统配置 7 大模块，共 25 个关键页面。</p>
      </div>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="data4.js"></script>
  <script src="app.js"></script>
</body>
</html>
