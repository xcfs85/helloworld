<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拼豆 · 移动端原型 v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶部 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FF8A5A"/>
              <stop offset="100%" stop-color="#F5C45E"/>
            </linearGradient>
          </defs>
          <circle cx="8" cy="8" r="3" fill="url(#lg)"/>
          <circle cx="16" cy="8" r="3" fill="#2A1F1A"/>
          <circle cx="24" cy="8" r="3" fill="url(#lg)"/>
          <circle cx="8" cy="16" r="3" fill="#2A1F1A"/>
          <circle cx="16" cy="16" r="3" fill="url(#lg)"/>
          <circle cx="24" cy="16" r="3" fill="#2A1F1A"/>
          <circle cx="8" cy="24" r="3" fill="url(#lg)"/>
          <circle cx="16" cy="24" r="3" fill="#2A1F1A"/>
          <circle cx="24" cy="24" r="3" fill="url(#lg)"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">拼豆 <span class="brand-en">PINDOU</span></div>
        <div class="brand-sub">AI 照片转拼豆图纸 · 移动端原型</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="pill">v0.1</span>
      <span class="pill soft">375 × 812</span>
      <span class="pill soft">iOS / Android</span>
    </div>
  </header>

  <!-- 主体 -->
  <main class="layout">
    <!-- 左侧：屏幕导航 -->
    <aside class="nav" id="nav">
      <div class="nav-search">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm5 12l4 4"/></svg>
        <input type="text" placeholder="搜索页面 / 路由…" id="navSearch" />
      </div>
      <div class="nav-list" id="navList"></div>
      <div class="nav-foot">
        <div>设计系统：温暖色系 · 8dp 网格</div>
        <div>主色 <span class="dot" style="background:#FF7A5A"></span> #FF7A5A</div>
      </div>
    </aside>

    <!-- 中间：手机模拟 -->
    <section class="stage">
      <div class="stage-bar">
        <button class="ghost-btn" id="prevScreen" title="上一个">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="stage-title">
          <div class="stage-name" id="stageName">—</div>
          <div class="stage-route" id="stageRoute">—</div>
        </div>
        <button class="ghost-btn" id="nextScreen" title="下一个">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="phone-wrap">
        <div class="phone">
          <div class="notch"></div>
          <div class="status-bar">
            <span>9:41</span>
            <span class="status-icons">
              <svg viewBox="0 0 16 12" width="16" height="12"><path fill="currentColor" d="M2 9h2v2H2zm4-2h2v4H6zm4-2h2v6h-2zm4-2h2v8h-2z"/></svg>
              <svg viewBox="0 0 16 12" width="16" height="12"><path fill="currentColor" d="M8 2c2 0 4 .8 5.5 2L11.8 5.6A4 4 0 0 0 8 4.2a4 4 0 0 0-3.8 1.4L2.5 4A7 7 0 0 1 8 2zm0 3a4 4 0 0 1 2.8 1.2L8.7 8.3a1 1 0 0 0-1.4 0L5.2 6.2A4 4 0 0 1 8 5z"/></svg>
              <svg viewBox="0 0 24 12" width="22" height="12"><rect x="1" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="3" width="16" height="6" rx="1" fill="currentColor"/><rect x="22" y="4" width="2" height="4" fill="currentColor"/></svg>
            </span>
          </div>
          <div class="screen" id="screen"></div>
        </div>
      </div>

      <div class="stage-foot">
        <span id="stageIndex">1 / 20</span>
        <span class="muted">使用 ← → 切换页面 · 点击左侧列表跳转</span>
      </div>
    </section>

    <!-- 右侧：说明面板 -->
    <aside class="notes">
      <div class="notes-card">
        <div class="notes-eyebrow">页面说明</div>
        <h3 id="notesTitle">—</h3>
        <p id="notesDesc" class="muted">—</p>
      </div>
      <div class="notes-card">
        <div class="notes-eyebrow">核心元素</div>
        <ul id="notesElements" class="bullets"></ul>
      </div>
      <div class="notes-card">
        <div class="notes-eyebrow">设计要点</div>
        <ul id="notesDesign" class="bullets"></ul>
      </div>
      <div class="notes-card subtle">
        <div class="notes-eyebrow">移动端需求</div>
        <p class="muted small">本原型基于 <b>移动端需求规格说明书 v0.1</b>，覆盖 M1 登录、M2 创作、M3 论坛、M4 模板、M5 色号推荐与个人中心，共 20 个关键页面。</p>
      </div>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="data4.js"></script>
  <script src="app.js"></script>
</body>
</html>
