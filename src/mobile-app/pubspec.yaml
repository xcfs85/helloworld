name: pindou_mobile
description: 拼豆App - AI照片转拼豆图纸工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  get: ^4.6.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  permission_handler: ^11.1.0
  web_socket_channel: ^2.4.0
  intl: ^0.18.1
  flutter_svg: ^2.0.9
  palette_generator: ^0.3.3+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
